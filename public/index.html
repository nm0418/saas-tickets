<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaaS Tickets</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#333}
button{padding:8px 12px;border:none;background:#a32a29;color:#fff;border-radius:6px;cursor:pointer}
button.sec{background:#bb8a0b}
input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
header{background:#a32a29;color:#fff;padding:14px 20px;border-bottom:4px solid #bb8a0b;display:flex;justify-content:space-between;align-items:center}
#login{max-width:320px;margin:15vh auto;background:#fff;padding:24px;border-radius:10px;display:flex;flex-direction:column;gap:10px;border-top:4px solid #bb8a0b}
#app{display:none;height:calc(100vh - 62px)}
#side{width:35%;min-width:260px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
#nuevo{padding:12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #ddd}
#lista{flex:1;overflow-y:auto}
.t{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.t:hover,.t.sel{background:#f9efe0}
.b{font-size:11px;padding:2px 6px;border-radius:10px;background:#eee;margin-left:4px}
.alta{background:#f5c6c6}.cerrado{background:#c9e8c9}
#det{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;padding:14px;border-radius:8px;border-top:3px solid #bb8a0b}
.row{display:flex;gap:6px;align-items:center}.row input[type=text]{flex:1}
.msg{padding:6px 10px;background:#f0f0f0;border-radius:8px;margin:4px 0}
.hecha{text-decoration:line-through;color:#888}
</style>
</head>
<body>
<header><b>🎫 SaaS Tickets y Tareas</b><span id="quien"></span></header>

<div id="login">
  <h3 style="margin:0">Acceso</h3>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <button class="sec" onclick="registro()">Registrarse</button>
</div>

<div id="app">
  <div id="side">
    <div id="nuevo">
      <input id="n-titulo" placeholder="Título del ticket">
      <textarea id="n-desc" rows="2" placeholder="Descripción"></textarea>
      <div class="row">
        <select id="n-prio"><option>baja</option><option selected>media</option><option>alta</option></select>
        <button onclick="crearTicket()">+ Crear ticket</button>
      </div>
    </div>
    <div id="lista"></div>
  </div>
  <div id="det"><p>Selecciona un ticket.</p></div>
</div>

<script>
let token = "", me = "", actual = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(url, method = "GET", body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: body ? JSON.stringify(body) : undefined
  });
   if (res.status === 401 && token) { location.reload(); }
  const d = await res.json();
  if (!res.ok) { alert(d.error || "Error"); throw new Error(d.error); }
  return d;
}

async function login() {
  const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
  const d = await res.json();
  if (!res.ok) return alert(d.error || "Error de login");
  token = d.token; me = d.username;
  $("quien").innerText = "👤 " + me;
  $("login").style.display = "none"; $("app").style.display = "flex";
  cargarTickets();
}

async function registro() {
  const res = await fetch("/registro", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
  const d = await res.json();
  alert(res.ok ? "Usuario creado, ya puedes entrar" : d.error);
}

async function cargarTickets() {
  const ts = await api("/tickets");
  $("lista").innerHTML = ts.map(t => `
    <div class="t ${actual === t._id ? "sel" : ""}" onclick="abrir('${t._id}')">
      <b>${esc(t.titulo)}</b>
      <span class="b ${t.prioridad}">${t.prioridad}</span>
      <span class="b ${t.estado}">${t.estado.replace("_", " ")}</span>
      <div style="font-size:12px;color:#777">por ${esc(t.creador)}</div>
    </div>`).join("") || "<p style='padding:12px'>Sin tickets todavía.</p>";
}

async function crearTicket() {
  const titulo = $("n-titulo").value.trim();
  if (!titulo) return alert("Escribe un título");
  const t = await api("/tickets", "POST", { titulo, descripcion: $("n-desc").value, prioridad: $("n-prio").value });
  $("n-titulo").value = ""; $("n-desc").value = "";
  await cargarTickets(); abrir(t._id);
}

async function abrir(id) {
  actual = id;
  const [ts, tareas, msgs] = await Promise.all([api("/tickets"), api(`/tickets/${id}/tareas`), api(`/tickets/${id}/mensajes`)]);
  const t = ts.find(x => x._id === id);
  if (!t) return;
  $("det").innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${esc(t.titulo)}</h3>
      <p>${esc(t.descripcion) || "<i>Sin descripción</i>"}</p>
      <div class="row">
        Estado:
        <select onchange="cambiarEstado('${id}',this.value)">
          ${["abierto", "en_progreso", "cerrado"].map(e => `<option ${e === t.estado ? "selected" : ""}>${e}</option>`).join("")}
        </select>
        <button class="sec" onclick="borrarTicket('${id}')">Eliminar ticket</button>
      </div>
    </div>
    <div class="card"><b>✅ Tareas</b>
      ${tareas.map(x => `<div class="row">
        <input type="checkbox" ${x.hecha ? "checked" : ""} onchange="toggleTarea('${x._id}',this.checked)">
        <span class="${x.hecha ? "hecha" : ""}" style="flex:1">${esc(x.titulo)}</span>
        <button class="sec" onclick="borrarTarea('${x._id}')">✕</button></div>`).join("")}
      <div class="row" style="margin-top:8px"><input type="text" id="n-tarea" placeholder="Nueva tarea">
        <button onclick="crearTarea()">Añadir</button></div>
    </div>
    <div class="card"><b>💬 Comentarios</b>
      ${msgs.map(m => `<div class="msg"><b>${esc(m.de)}</b>: ${esc(m.mensaje)}</div>`).join("")}
      <div class="row" style="margin-top:8px"><input type="text" id="n-msg" placeholder="Escribe un comentario">
        <button onclick="comentar()">Enviar</button></div>
    </div>`;
  cargarTickets();
}

async function cambiarEstado(id, estado) { await api("/tickets/" + id, "PATCH", { estado }); cargarTickets(); }
async function borrarTicket(id) {
  if (!confirm("¿Eliminar ticket con sus tareas y comentarios?")) return;
  await api("/tickets/" + id, "DELETE"); actual = null;
  $("det").innerHTML = "<p>Selecciona un ticket.</p>"; cargarTickets();
}
async function crearTarea() {
  const titulo = $("n-tarea").value.trim(); if (!titulo) return;
  await api(`/tickets/${actual}/tareas`, "POST", { titulo }); abrir(actual);
}
async function toggleTarea(id, hecha) { await api("/tareas/" + id, "PATCH", { hecha }); abrir(actual); }
async function borrarTarea(id) { await api("/tareas/" + id, "DELETE"); abrir(actual); }
async function comentar() {
  const mensaje = $("n-msg").value.trim(); if (!mensaje) return;
  await api(`/tickets/${actual}/mensajes`, "POST", { mensaje }); abrir(actual);
}
$("pass").addEventListener("keypress", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
